version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    command: ["/entrypoint.sh"]
    ports:
      - "${APP_EXTERNAL_PORT}:${APP_INTERNAL_PORT}"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

volumes:
  postgres-data:
